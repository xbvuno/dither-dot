name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Debug Git
        run: |
          echo "GitHub SHA: ${{ github.sha }}"
          git rev-parse HEAD
          git log --oneline -5
          git status

      - name: Debug Node
        run: |
          node -v
          npm -v

      - name: Debug package
        run: |
          node -p "require('./package.json').version"
          node -p "require('./package-lock.json').lockfileVersion"

      - name: Search emnapi
        run: |
          grep -n "@emnapi/core" package-lock.json || true
          grep -n "@emnapi/runtime" package-lock.json || true

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          command: deploy